[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "txapi-sdk"
version = "1.0.0"
description = "Official Python SDK for the txApi REST and WebSocket API (txAdmin / FiveM server management)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Josef Peter" }]
keywords = ["txadmin", "fivem", "txapi", "api", "sdk", "gta", "cfx"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: AsyncIO",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.25,<1"]

[project.optional-dependencies]
live = ["websockets>=13"]
dev = [
  "websockets>=13",
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "mypy>=1.10",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://txapi.cloud"
Documentation = "https://txapi.cloud/docs/sdks"
Source = "https://github.com/txadmin-api/txapi-sdks/tree/main/python"
Issues = "https://github.com/txadmin-api/txapi-sdks/issues"
Changelog = "https://github.com/txadmin-api/txapi-sdks/blob/main/python/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/txapi"]

[tool.hatch.build.targets.sdist]
include = ["src/txapi", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PIE", "PT", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"src/txapi/_generated.py" = ["E501", "A002"]
"scripts/generate.py" = ["E501"]
"tests/*" = ["B011", "PT011", "SIM117"]
"examples/*" = ["T201"]
